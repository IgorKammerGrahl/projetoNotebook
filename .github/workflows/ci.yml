name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.77.0   # same as local development; install is --locked by pixi.lock
      - name: Backend
        run: pixi run test
      - name: Frontend
        run: |
          pixi run frontend-install
          pixi run frontend-test
      # ponytail: Chromium downloaded every run; cache ~/.cache/ms-playwright if CI time matters
      - name: Browser (Chromium)
        run: |
          pixi run npm --prefix frontend exec -- playwright install --with-deps chromium
          pixi run frontend-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
          if-no-files-found: ignore
