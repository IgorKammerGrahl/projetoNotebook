[workspace]
authors = ["Igor Kammer Grahl <igorkramigra@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "projetoNotebook"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "python -m pytest -q"
frontend-install = "npm --prefix frontend ci"
frontend-build = "npm --prefix frontend run build"
frontend-test = "npm --prefix frontend test"
frontend-e2e-install = "npm --prefix frontend run test:e2e:install"
frontend-e2e = { cmd = "npm --prefix frontend run test:e2e", depends-on = ["frontend-build"] }

[dependencies]
mojo = ">=1.1.0,<2"
python = ">=3.14.7,<3.15"
numpy = ">=2.5.3,<3"
pytest = ">=9.1.1,<10"
aiohttp = ">=3.14.3,<4"
nodejs = ">=26.10.0,<26.11"
